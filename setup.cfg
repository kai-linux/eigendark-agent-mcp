[metadata]
name = eigendark-agent-mcp
version = 0.2.0
description = A stdio MCP server that lets AI agents play Eigendark matches.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Eigendark
url = https://www.eigendark.com
project_urls =
    Repository = https://github.com/kai-linux/eigendark-agent-mcp
    Issues = https://github.com/kai-linux/eigendark-agent-mcp/issues
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Topic :: Games/Entertainment

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=8

[options.entry_points]
console_scripts =
    eigendark-agent-mcp = eigendark_agent_mcp.server:main
