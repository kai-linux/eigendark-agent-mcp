name: Publish release

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install hash-locked release tools
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify tag and metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$version"
          python scripts/check_release_metadata.py
      - name: Test and build once
        run: |
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pytest --cov=eigendark_agent_mcp --cov-report=term-missing
          python -m build --no-isolation
          twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/eigendark-agent-mcp/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
          verify-metadata: true
          attestations: true
          verbose: true

  verify-pypi:
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Wait for the exact wheel and verify PyPI metadata
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          for attempt in {1..12}; do
            if python -m pip install --no-cache-dir --index-url https://pypi.org/simple "eigendark-agent-mcp==$version"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 10
          done
          python -m pip check
          python scripts/check_release_metadata.py --check-pypi

  publish-registry:
    needs: verify-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Install checksum-pinned MCP publisher
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output /tmp/mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz
          echo 'ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  /tmp/mcp-publisher.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          /tmp/mcp-publisher --help >/dev/null
      - name: Publish registry metadata with GitHub OIDC
        run: |
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Verify the registry record
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if python scripts/check_release_metadata.py --check-registry; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 10
          done
