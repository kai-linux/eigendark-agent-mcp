name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-locked test environment
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Test official MCP client integration with coverage
        run: python -m pytest --cov=eigendark_agent_mcp --cov-report=term-missing

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.1"
          enable-cache: false
      - name: Install hash-locked quality tools
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock
      - name: Lint and format
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Static security analysis
        run: bandit -c pyproject.toml -r src
      - name: Audit runtime dependencies
        run: |
          pip-audit --require-hashes -r requirements-runtime.lock
          pip-audit --require-hashes -r requirements-dev.lock
      - name: Validate release and registry metadata
        run: |
          python scripts/check_release_metadata.py
          check-jsonschema --schemafile https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json server.json
      - name: Validate vulnerability exceptions and workflows
        run: |
          python scripts/check_trivy_exceptions.py
          python scripts/check_workflows.py
      - name: Validate workflow syntax and expressions
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
      - name: Reject lock-file drift
        run: |
          uv pip compile --universal --python-version 3.11 --generate-hashes pyproject.toml --output-file requirements-runtime.lock
          uv pip compile --universal --python-version 3.11 --generate-hashes --extra dev pyproject.toml --output-file requirements-dev.lock
          uv pip compile --universal --python-version 3.11 --generate-hashes requirements-build.in --output-file requirements-build.lock
          git diff --exit-code -- requirements-build.lock requirements-dev.lock requirements-runtime.lock

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install hash-locked build tools
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock
      - name: Build and inspect distributions
        run: |
          python -m build --no-isolation
          twine check dist/*
          python scripts/check_release_metadata.py
          python scripts/check_distribution.py dist "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
      - name: Install the wheel into a clean environment
        run: |
          set -euo pipefail
          python -m venv /tmp/eigendark-wheel-smoke
          /tmp/eigendark-wheel-smoke/bin/python -m pip install --only-binary=:all: --require-hashes -r requirements-runtime.lock
          /tmp/eigendark-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/eigendark-wheel-smoke/bin/python -m pip check
          response="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"wheel-smoke","version":"1"}}}' | /tmp/eigendark-wheel-smoke/bin/eigendark-agent-mcp)"
          grep -q '"name":"eigendark-agent-mcp"' <<<"$response"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          version: "1.26.1"
          persona: auditor
          min-severity: medium
          advanced-security: false
          annotations: true

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag eigendark-agent-mcp:test .
      - name: Run newline MCP smoke test without a network
        run: |
          set -euo pipefail
          response="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"container-smoke","version":"1"}}}' | docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m -i eigendark-agent-mcp:test)"
          grep -q '"name":"eigendark-agent-mcp"' <<<"$response"
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: eigendark-agent-mcp:test
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          version: v0.72.0
          cache: false
