name: Scheduled security scan

on:
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:

concurrency:
  group: scheduled-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install hash-locked scanners
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock
      - name: Audit dependencies and exception expiry
        run: |
          pip-audit --require-hashes -r requirements-runtime.lock
          pip-audit --require-hashes -r requirements-dev.lock
          python scripts/check_trivy_exceptions.py
      - name: Verify published package and MCP Registry record
        run: >-
          python scripts/check_release_metadata.py --check-pypi
          --verify-pypi-attestations --check-registry

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Rebuild current runtime image
        run: docker build --pull --tag eigendark-agent-mcp:scheduled .
      - name: Scan current runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: eigendark-agent-mcp:scheduled
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          version: v0.72.0
          cache: false
