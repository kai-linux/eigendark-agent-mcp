  - id: CVE-2026-16742
    purls:
      - "pkg:deb/debian/libsystemd0@257.13-1~deb13u1?arch=amd64&distro=debian-13.5"
      - "pkg:deb/debian/libudev1@257.13-1~deb13u1?arch=amd64&distro=debian-13.5"
    statement: >-
