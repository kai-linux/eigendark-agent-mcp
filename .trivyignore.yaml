vulnerabilities:
  - id: CVE-2026-53615
    purls:
      - "pkg:deb/debian/bsdutils@2.41-5?arch=amd64&distro=debian-13.5&epoch=1"
      - "pkg:deb/debian/libblkid1@2.41-5?arch=amd64&distro=debian-13.5"
      - "pkg:deb/debian/liblastlog2-2@2.41-5?arch=amd64&distro=debian-13.5"
      - "pkg:deb/debian/libmount1@2.41-5?arch=amd64&distro=debian-13.5"
      - "pkg:deb/debian/libsmartcols1@2.41-5?arch=amd64&distro=debian-13.5"
      - "pkg:deb/debian/libuuid1@2.41-5?arch=amd64&distro=debian-13.5"
      - "pkg:deb/debian/login@4.16.0-2%2Breally2.41-5?arch=amd64&distro=debian-13.5&epoch=1"
      - "pkg:deb/debian/mount@2.41-5?arch=amd64&distro=debian-13.5"
      - "pkg:deb/debian/util-linux@2.41-5?arch=amd64&distro=debian-13.5"
    statement: >-
      Debian 13 has no fixed util-linux package. The server never opens block
      devices or invokes libblkid, runs without device capabilities, and has no
      subprocess surface. Reassess on the next base-image refresh.
    expired_at: 2026-09-30
  - id: CVE-2026-41992
    purls:
      - "pkg:deb/debian/gzip@1.13-1?arch=amd64&distro=debian-13.5"
    statement: >-
      Debian 13 has no fixed gzip package. The runtime never invokes gzip or
      accepts archive files, and application input cannot reach this command.
      Reassess on the next base-image refresh.
    expired_at: 2026-09-30
  - id: CVE-2025-69720
    purls:
      - "pkg:deb/debian/libncursesw6@6.5%2B20250216-2?arch=amd64&distro=debian-13.5"
      - "pkg:deb/debian/libtinfo6@6.5%2B20250216-2?arch=amd64&distro=debian-13.5"
      - "pkg:deb/debian/ncurses-base@6.5%2B20250216-2?arch=all&distro=debian-13.5"
      - "pkg:deb/debian/ncurses-bin@6.5%2B20250216-2?arch=amd64&distro=debian-13.5"
    statement: >-
      The affected ncurses infocmp command is never invoked by this stdio
      service and no terminfo data is accepted. Debian 13 has no fixed package.
      Reassess on the next base-image refresh.
    expired_at: 2026-09-30
  - id: CVE-2026-54369
    purls:
      - "pkg:deb/debian/libacl1@2.3.2-2%2Bb1?arch=amd64&distro=debian-13.5"
    statement: >-
      The affected pathname ACL functions are never called, the service runs as
      an unprivileged user, and it processes no caller-selected filesystem paths.
      Debian 13 has no fixed package; reassess on the next base refresh.
    expired_at: 2026-09-30
  - id: CVE-2026-42496
    purls:
      - "pkg:deb/debian/perl-base@5.40.1-6?arch=amd64&distro=debian-13.5"
    statement: >-
      The affected Perl Archive::Tar extraction code is never invoked and the
      service accepts no archives or filesystem paths. Debian 13 has no fixed
      package; reassess on the next base-image refresh.
    expired_at: 2026-09-30
  - id: CVE-2026-42497
    purls:
      - "pkg:deb/debian/perl-base@5.40.1-6?arch=amd64&distro=debian-13.5"
    statement: >-
      The affected Perl Archive::Tar hardlink extraction code is never invoked
      and the service accepts no archives or filesystem paths. Debian 13 has no
      fixed package; reassess on the next base-image refresh.
    expired_at: 2026-09-30
  - id: CVE-2026-48962
    purls:
      - "pkg:deb/debian/perl-base@5.40.1-6?arch=amd64&distro=debian-13.5"
    statement: >-
      The affected Perl IO::Compress File::GlobMapper module is never imported
      or invoked, and no output glob is accepted. Debian 13 has no fixed package;
      reassess on the next base-image refresh.
    expired_at: 2026-09-30
  - id: CVE-2026-8376
    purls:
      - "pkg:deb/debian/perl-base@5.40.1-6?arch=amd64&distro=debian-13.5"
    statement: >-
      This Perl regular-expression overflow affects only 32-bit builds; the
      published container is linux/amd64. Perl is not invoked by the service.
      Debian 13 has no fixed package; reassess on the next base refresh.
    expired_at: 2026-09-30
  - id: CVE-2026-9538
    purls:
      - "pkg:deb/debian/perl-base@5.40.1-6?arch=amd64&distro=debian-13.5"
    statement: >-
      The affected Perl Archive::Tar entry reader is never invoked and the
      service accepts no archive input. Debian 13 has no fixed package; reassess
      on the next base-image refresh.
    expired_at: 2026-09-30
  - id: CVE-2026-13221
    purls:
      - "pkg:deb/debian/perl-base@5.40.1-6?arch=amd64&distro=debian-13.5"
    statement: >-
      The affected Perl regular-expression compiler is unreachable because the
      Python runtime never executes Perl or accepts Perl programs or patterns.
      Debian 13 has no fixed package; reassess on the next base-image refresh.
    expired_at: 2026-09-30
  - id: CVE-2026-57432
    purls:
      - "pkg:deb/debian/perl-base@5.40.1-6?arch=amd64&distro=debian-13.5"
    statement: >-
      The affected Perl UTF-8 string measurement path is unreachable because
      the Python runtime never invokes Perl and accepts no executable input.
      Debian 13 has no fixed package; reassess on the next base-image refresh.
    expired_at: 2026-09-30
  - id: CVE-2026-57433
    purls:
      - "pkg:deb/debian/perl-base@5.40.1-6?arch=amd64&distro=debian-13.5"
    statement: >-
      The affected Perl Storable deserializer is unreachable because this
      Python service never executes Perl, imports Storable, or accepts
      Perl-serialized input. Debian 13 has no fixed package; reassess on the
      next base-image refresh.
    expired_at: 2026-09-30

  - id: CVE-2026-11822
    purls:
      - "pkg:deb/debian/libsqlite3-0@3.46.1-7%2Bdeb13u1?arch=amd64&distro=debian-13.5"
    statement: >-
      The MCP service does not use SQLite, accepts no database files, and never
      exposes the affected FTS5 parser to caller-controlled data. Reassess on the
      next base-image refresh.
    expired_at: 2026-09-30
