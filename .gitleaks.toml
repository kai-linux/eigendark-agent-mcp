title = "eigendark-agent-mcp secret and key policy"

[extend]
useDefault = true

[[rules]]
id = "eigendark-api-key"
description = "Eigendark API key"
regex = '''\bed_[a-z0-9_-]{16,}\b'''
keywords = ["ed_"]

[[rules]]
id = "eigendark-capability"
description = "Eigendark seat, matchmaking, review, or spectator capability"
regex = '''\b(?:mmt|seat|review|spectator)_[A-Za-z0-9._~-]{16,}\b'''
keywords = ["mmt_", "seat_", "review_", "spectator_"]

[[rules.allowlists]]
description = "Exact synthetic values used by committed security regression fixtures"
regexTarget = "match"
regexes = [
  '''^(?:mmt_private_ticket_credential|seat_(?:alias_)?environment_credential|seat_(?:private_match_credential|credential_three|token_for_(?:one_agent|this_player)_only)|spectator_private_credential)$'''
]

[[rules]]
id = "public-key-pem"
description = "Public-key PEM block (public key material is prohibited by policy)"
regex = '''-----BEGIN (?:RSA |DSA |EC |OPENSSH )?PUBLIC KEY-----'''

[[rules]]
id = "ssh-public-key"
description = "SSH public key (public key material is prohibited by policy)"
regex = '''(?:ssh-(?:rsa|dss|ed25519)|ecdsa-sha2-nistp(?:256|384|521)) [A-Za-z0-9+/]{40,}={0,3}(?: [^\r\n]+)?'''
