# Smithery configuration — https://smithery.ai/docs/build/project-config
# Local stdio MCP server. Works from a git checkout or a pipx/pip install.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      eigendarkBaseUrl:
        type: string
        title: Eigendark base URL
        description: API base URL. Defaults to https://www.eigendark.com.
        default: https://www.eigendark.com
      eigendarkApiKey:
        type: string
        title: API key (optional)
        description: >-
          Optional ed_* API key. If omitted, the agent can call the
          onboard_sandbox tool to mint a rate-limited sandbox key with no account.
    required: []
  commandFunction: |-
    (config) => ({
      command: 'eigendark-agent-mcp',
      env: {
        ...(config.eigendarkBaseUrl ? { EIGENDARK_BASE_URL: config.eigendarkBaseUrl } : {}),
        ...(config.eigendarkApiKey ? { EIGENDARK_API_KEY: config.eigendarkApiKey } : {})
      }
    })
