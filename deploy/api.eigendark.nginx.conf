limit_req_zone $binary_remote_addr zone=eigendark_mcp_requests:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=eigendark_gpt_starts:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=eigendark_gpt_turns:10m rate=1200r/m;
limit_conn_zone $binary_remote_addr zone=eigendark_mcp_connections:10m;

geo $eigendark_openai_action_client {
    default 0;
    include /etc/nginx/openai-actions/client-ips.conf;
}

server {
    server_name api.eigendark.com;

    # Request—but do not require—the connector certificate globally because
    # this origin also serves the existing backend. /mcp requires and verifies it.
    ssl_verify_client optional;
    ssl_verify_depth 2;
    ssl_client_certificate /etc/nginx/openai-connectors/client-ca.pem;

    location = /mcp {
        if ($ssl_client_verify != SUCCESS) { return 403; }

        client_max_body_size 2m;
        limit_conn eigendark_mcp_connections 20;
        limit_req zone=eigendark_mcp_requests burst=100 nodelay;

        proxy_pass http://127.0.0.1:5003/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-OpenAI-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-OpenAI-Client-Cert $ssl_client_escaped_cert;
    }

    # The schema is public so the GPT editor can import and validate it. The
    # mutating Action endpoints accept traffic only from OpenAI's published,
    # deployment-refreshed ChatGPT Actions egress ranges.
    location = /gpt/openapi.json {
        limit_req zone=eigendark_gpt_starts burst=20 nodelay;
        proxy_pass http://127.0.0.1:5003/gpt/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /gpt/play {
        if ($eigendark_openai_action_client = 0) { return 403; }

        client_max_body_size 64k;
        limit_conn eigendark_mcp_connections 40;
        limit_req zone=eigendark_gpt_starts burst=20 nodelay;
        proxy_pass http://127.0.0.1:5003/gpt/play;
        proxy_http_version 1.1;
        proxy_read_timeout 45s;
        proxy_send_timeout 15s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/gpt/(game|turn)$ {
        if ($eigendark_openai_action_client = 0) { return 403; }

        client_max_body_size 64k;
        limit_conn eigendark_mcp_connections 40;
        limit_req zone=eigendark_gpt_turns burst=100 nodelay;
        proxy_pass http://127.0.0.1:5003$request_uri;
        proxy_http_version 1.1;
        proxy_read_timeout 45s;
        proxy_send_timeout 15s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* /(phpmyadmin|wp-login\.php|\.env|\.git|\.htaccess) {
        return 444;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.eigendark.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.eigendark.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = api.eigendark.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name api.eigendark.com;
    return 404;
}
